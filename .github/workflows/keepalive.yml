name: Keep-alive

# Free tiers sleep or pause when unused. Once a day this wakes the backend and
# makes it touch the database, so Supabase never hits its 7-day inactivity pause.
# (A free cron-job.org job pings /health every 10 minutes to keep Render awake.)
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC = 08:47 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake backend and touch database
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then echo "Set the BACKEND_URL repository variable first"; exit 1; fi
          for i in 1 2 3 4 5 6; do
            if curl -sf --max-time 90 "$BACKEND_URL/health/deep"; then echo; echo "awake"; exit 0; fi
            echo "attempt $i failed, retrying"; sleep 20
          done
          exit 1
